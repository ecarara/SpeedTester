name: Resolve apt mirrors and install packages
description: Restore runner name resolution and install apt packages with retries
inputs:
  packages:
    description: Space separated package list installed after the mirrors resolve
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Restore name resolution for the apt mirrors
      shell: bash
      run: |
        set -euo pipefail
        if getent hosts archive.ubuntu.com >/dev/null; then
          exit 0
        fi
        # Hosted runners occasionally lose their local resolver while the
        # network itself is fine; restarting it, or falling back to the Azure
        # and public resolvers, keeps package installation deterministic.
        sudo systemctl restart systemd-resolved 2>/dev/null || true
        for _ in $(seq 1 10); do
          if getent hosts archive.ubuntu.com >/dev/null; then
            exit 0
          fi
          sleep 3
        done
        printf 'nameserver 168.63.129.16\nnameserver 8.8.8.8\nnameserver 1.1.1.1\n' | sudo tee /etc/resolv.conf >/dev/null
        getent hosts archive.ubuntu.com
    - name: Install apt packages with retries
      if: inputs.packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          sudo apt-get update && sudo apt-get install --yes $PACKAGES && exit 0
          sleep $((attempt * 20))
        done
        exit 1
