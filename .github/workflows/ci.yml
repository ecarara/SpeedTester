name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit and integration tests with coverage
        env:
          PYTHONPATH: app
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage combine
          python -m coverage xml

      - name: Community installer and packaged entry point
        env:
          PYTHONPATH: app
        run: |
          bash -n install-community.sh
          python -m pip install --no-deps .
          speedtester-client --help
          python - <<'PY'
          from pathlib import Path
          from speedtester_protocol.installation import systemd_unit
          Path('/tmp/speedtester-client-check.service').write_text(systemd_unit('/usr/bin/true','/tmp'))
          PY
          systemd-analyze verify /tmp/speedtester-client-check.service

      - name: Compile Python
        run: python -m compileall -q app

      - name: Check documentation links
        run: python scripts/check_docs.py

      - name: Check GPL metadata
        run: python scripts/check_license.py

      - name: Check publication hygiene
        run: python scripts/check_publication.py

      - name: Validate dashboard JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('app/dashboard/index.html', 'utf8');
          for (const match of html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)) {
            new Function(match[1]);
          }
          new Function(fs.readFileSync('app/dashboard/charts.js','utf8'));
          console.log('dashboard-js-ok');
          NODE

      - name: Check whitespace
        run: git diff --check

  compose:
    name: Compose syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose file
        run: docker compose -f docker/compose.yaml config --quiet
      - name: Build container images
        run: docker compose -f docker/compose.yaml build

      - name: Start API and run container smoke tests
        env:
          API_REQUIRE_LOGIN: 'false'
        run: |
          docker compose -f docker/compose.yaml up -d db api --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/api/config
          curl --fail http://127.0.0.1:8000/api/chart.png --output /tmp/speedtester-chart.png
          test "$(head -c 8 /tmp/speedtester-chart.png | od -An -tx1 | tr -d ' \n')" = 89504e470d0a1a0a
          test "$(docker compose -f docker/compose.yaml exec -T api id -u)" = 10001
          docker compose -f docker/compose.yaml run --rm backup /opt/speedtester-scripts/backup.sh
      - name: Validate encrypted off-host backup and restore
        run: |
          docker compose -f docker/compose.yaml run --rm --entrypoint bash -e TMPDIR=/backups \
            -v "${{ github.workspace }}:/workspace:ro" backup /workspace/scripts/test_backup.sh
      - name: Validate compiled tools in runtime images
        run: |
          docker compose -f docker/compose.yaml run --rm --no-deps backup sh -c 'ssh -V && age --version'
          docker compose -f docker/compose.yaml run --rm --no-deps collector python - <<'PY'
          import json, subprocess, time
          server = subprocess.Popen(['iperf3', '-s', '-1', '-B', '127.0.0.1', '-p', '15201'], stdout=subprocess.DEVNULL)
          try:
              time.sleep(1)
              result = subprocess.run(['iperf3', '-c', '127.0.0.1', '-p', '15201', '-t', '1', '-P', '2', '-J'], capture_output=True, text=True, check=True, timeout=15)
              assert json.loads(result.stdout)['end']['sum_received']['bits_per_second'] > 0
              server.wait(timeout=5)
          finally:
              if server.poll() is None:
                  server.terminate()
                  server.wait(timeout=5)
          PY
      - name: Clean up
        if: always()
        run: docker compose -f docker/compose.yaml down --volumes

  dashboard:
    name: Dashboard acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r app/requirements.txt
      - run: python -m pip_audit -r app/requirements-community.txt

  linux-packages:
    name: Python 3.14 DEB and RPM runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install package toolchain and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm cpio iperf3
          python -m pip install --only-binary=:all: -r requirements-dev.txt pyinstaller==6.22.3
      - name: Freeze the shared Python 3.14 runtime
        run: python scripts/build_linux_runtime.py --output dist/linux-runtime --version 0.0.0
      - name: Build both package formats from the verified runtime
        env:
          APP_VERSION: '0.0.0'
          PYTHON: python
          SPEEDTESTER_RUNTIME: ${{ github.workspace }}/dist/linux-runtime
          OUTPUT_DIR: ${{ github.workspace }}/dist/linux-packages
        run: |
          ./packaging/linux/build-deb.sh
          ./packaging/linux/build-rpm.sh
      - name: Extract packages and execute their actual frozen API
        run: |
          mkdir -p /tmp/speedtester-deb /tmp/speedtester-rpm
          dpkg-deb --extract dist/linux-packages/*.deb /tmp/speedtester-deb
          rpm2cpio dist/linux-packages/*.rpm | (cd /tmp/speedtester-rpm && cpio -idm)
          python scripts/test_frozen_api.py --executable /tmp/speedtester-deb/usr/lib/speedtester/runtime/SpeedTesterAPI/SpeedTesterAPI
          python scripts/test_frozen_api.py --executable /tmp/speedtester-rpm/usr/lib/speedtester/runtime/SpeedTesterAPI/SpeedTesterAPI
          test ! -e /tmp/speedtester-deb/usr/lib/speedtester/venv
          test ! -e /tmp/speedtester-rpm/usr/lib/speedtester/venv
