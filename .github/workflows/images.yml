name: Container images
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pull-request:
    name: PR image scan ${{ matrix.service }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [api, collector, backup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/install_security_tools.py grype --destination .security-tools
      - name: Build unprivileged PR image
        env:
          SERVICE: ${{ matrix.service }}
        run: docker build -f "docker/$SERVICE/Dockerfile" -t "speedtester-$SERVICE:pr" .
      - name: Scan image with the approved vulnerability policy
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p security-reports
          .security-tools/grype "docker:speedtester-$SERVICE:pr" -o json > "security-reports/grype-$SERVICE.json"
          python3 scripts/check_image_report.py "security-reports/grype-$SERVICE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: grype-pr-${{ matrix.service }}
          path: security-reports/grype-*.json
          retention-days: 14
  build:
    name: ${{ matrix.service }} amd64 + arm64
    if: github.repository == 'ecarara/SpeedTester' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, collector, backup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/install_security_tools.py grype --destination .security-tools
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ecarara/speedtester-${{ matrix.service }}:${{ github.ref_name }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/ecarara/speedtester-{0}:sha-{1}', matrix.service, github.sha) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/ecarara/SpeedTester
            org.opencontainers.image.licenses=GPL-3.0-or-later
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan the exact multiarch image digest
        env:
          IMAGE: ghcr.io/ecarara/speedtester-${{ matrix.service }}@${{ steps.image.outputs.digest }}
        run: |
          mkdir -p security-reports
          .security-tools/grype "registry:$IMAGE" --platform linux/amd64 -o json > security-reports/grype-amd64.json
          .security-tools/grype "registry:$IMAGE" --platform linux/arm64 -o json > security-reports/grype-arm64.json
          python3 scripts/check_image_report.py security-reports/grype-amd64.json security-reports/grype-arm64.json
      - name: Attest the scanned image digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/ecarara/speedtester-${{ matrix.service }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Retain image scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-${{ matrix.service }}
          path: security-reports/grype-*.json
          retention-days: 14
