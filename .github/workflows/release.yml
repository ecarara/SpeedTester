name: Release artifacts

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      msix-version: ${{ steps.version.outputs.msix-version }}
    steps:
      - name: Validate semantic version tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          [[ "$TAG" == v* ]] || { echo "release must be triggered by a v* tag" >&2; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "msix-version=$version.0" >> "$GITHUB_OUTPUT"

  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          check-latest: true
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: make check

  source:
    name: Source archive, SBOM and checksums
    needs: [metadata, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build release metadata
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p dist/release
          OUTPUT_DIR=dist/release ./scripts/build-source-tarball.sh
          cp install-speedtester-client.py dist/release/install-speedtester-client.py
          python3 scripts/build_sbom.py --version "$APP_VERSION" --output "dist/release/SpeedTester-$APP_VERSION.spdx.json"
          python3 scripts/generate_checksums.py dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: dist/release/*
          if-no-files-found: error

  linux-agent:
    name: Linux agent bundle
    needs: [metadata, quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          check-latest: true
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Native Linux build dependencies
        uses: ./.github/actions/apt-mirrors
        with:
          packages: xvfb libtk8.6 xdotool x11-xkb-utils xdg-utils build-essential libssl-dev patchelf pkg-config
      - name: Install public native build dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-desktop.txt -r app/requirements.txt
          python -m pip install --no-deps '.[desktop]'
      - name: Build frozen Linux agent bundle
        run: xvfb-run -a python scripts/build_desktop.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-agent
          path: |
            dist/desktop/releases/SpeedTesterClient-*-linux-*.tar.gz
            dist/desktop/releases/SpeedTesterClient-*-linux-*.tar.gz.sha256
            dist/desktop/releases/SpeedTesterClient-*-linux-*-components.json
          if-no-files-found: error

  linux-agent-package:
    name: Arch agent package
    needs: [metadata, linux-agent]
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel-20260925.0.599509
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-linux-agent
          path: dist/agent
      - name: Install pinned build utilities
        run: pacman -Sy --noconfirm --needed curl python
      - name: Build the opt-in agent package from this run's bundle
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          useradd --create-home builder
          mkdir -p dist/agent-pkg
          cp "dist/agent/SpeedTesterClient-${APP_VERSION}-linux-x86_64.tar.gz" dist/agent-pkg/
          cp -r packaging/linux/agent dist/agent-pkg/src
          sed -i "s/^pkgver=.*/pkgver=${APP_VERSION}/; s/^pkgrel=.*/pkgrel=1/" dist/agent-pkg/src/PKGBUILD
          python - <<'PY'
          from pathlib import Path

          pkgbuild = Path("dist/agent-pkg/src/PKGBUILD")
          lines = pkgbuild.read_text().splitlines()
          for index, line in enumerate(lines):
              if line.startswith("source=("):
                  lines[index] = 'source=("SpeedTesterClient-${pkgver}-linux-x86_64.tar.gz"'
                  break
          pkgbuild.write_text("\n".join(lines) + "\n")
          PY
          chown -R builder:builder dist/agent-pkg
          su builder -s /bin/bash -c "cd dist/agent-pkg/src && SRCDEST='$GITHUB_WORKSPACE/dist/agent-pkg' PKGDEST='$GITHUB_WORKSPACE/dist/agent-pkg' makepkg -f --nodeps --skipinteg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-agent-package
          path: dist/agent-pkg/*.pkg.tar.zst
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: [metadata, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          check-latest: true
      - name: Install packaging dependencies
        run: python -m pip install -r app/requirements.txt pyinstaller==6.22.3
      - name: Native macOS crypto runtime
        run: brew install openssl@3
      - name: Build unsigned macOS package
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
          MACOS_ARCH: ${{ matrix.arch }}
          OUTPUT_DIR: dist/macos
        run: ./packaging/macos/build-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/macos/*
          if-no-files-found: error

  windows:
    name: Windows x64 MSIX
    needs: [metadata, quality]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          check-latest: true
      - name: Install packaging dependencies
        run: python -m pip install -r app/requirements.txt pyinstaller==6.22.3
      - name: Native Windows measurement toolchain
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MSYS
          location: C:\speedtester-msys64
          update: true
          install: gcc make diffutils openssl-devel openssl pkgconf tar zstd
      - name: Pin OpenSSL 3 for the bundled iPerf3
        shell: pwsh
        run: |
          $root = 'C:\speedtester-openssl3'
          New-Item -ItemType Directory -Force $root | Out-Null
          $tar = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'usr\bin\tar.exe'
          foreach ($name in @('libopenssl-3.6.5-1','openssl-3.6.5-1','openssl-devel-3.6.5-1')) {
            $url = "https://repo.msys2.org/msys/x86_64/$name-x86_64.pkg.tar.zst"
            $file = Join-Path $env:RUNNER_TEMP "$name.pkg.tar.zst"
            Invoke-WebRequest -Uri $url -OutFile $file
            & $tar --force-local --zstd -xf $file -C $root
          }
      - name: Add Windows SDK packaging tools to PATH
        shell: pwsh
        run: |
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\\10\\bin'
          $makeAppx = Get-ChildItem $sdkRoot -Filter MakeAppx.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeAppx) { throw 'MakeAppx.exe não encontrado no Windows SDK do runner' }
          $makeAppx.DirectoryName | Out-File -FilePath ${env:GITHUB_PATH} -Append -Encoding utf8
          Write-Host "Using Windows SDK tools from $($makeAppx.DirectoryName)"
      - name: Build unsigned MSIX
        env:
          MSIX_VERSION: ${{ needs.metadata.outputs.msix-version }}
          APP_VERSION: ${{ needs.metadata.outputs.version }}
          SPEEDTESTER_MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          SPEEDTESTER_OPENSSL_ROOT: C:\speedtester-openssl3\usr
          SPEEDTESTER_OPENSSL_PREFIX: /c/speedtester-openssl3/usr
          SPEEDTESTER_OPENSSL_VERSION: '3.6.5'
        shell: pwsh
        run: |
          ./packaging/windows/build-launchers.ps1 -OutputDirectory dist/windows
          ./packaging/windows/build-msix.ps1 -Version $env:MSIX_VERSION -Architecture x64 -OutputDirectory dist/windows
          Copy-Item dist/desktop/releases/*.src.tar.zst dist/windows/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: |
            dist/windows/*.msix
            dist/windows/*.src.tar.zst
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.format }}
    needs: [metadata, quality]
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          check-latest: true
      - name: Install RPM toolchain
        if: matrix.format == 'rpm'
        uses: ./.github/actions/apt-mirrors
        with:
          packages: rpm
      - name: Prepare isolated runtime
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --only-binary=:all: -r app/requirements.txt pyinstaller==6.22.3
      - name: Build Debian package
        if: matrix.format == 'deb'
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
          SPEEDTESTER_VENV: ${{ github.workspace }}/.release-venv
          OUTPUT_DIR: dist/linux
        run: ./packaging/linux/build-deb.sh
      - name: Build RPM package
        if: matrix.format == 'rpm'
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
          SPEEDTESTER_VENV: ${{ github.workspace }}/.release-venv
          OUTPUT_DIR: dist/linux
        run: ./packaging/linux/build-rpm.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.format }}
          path: dist/linux/*
          if-no-files-found: error

  flatpak:
    name: Linux Flatpak
    needs: [metadata, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flatpak toolchain
        uses: ./.github/actions/apt-mirrors
        with:
          packages: flatpak flatpak-builder
      - name: Register the Flatpak SDK
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive flathub org.freedesktop.Sdk//24.08 org.freedesktop.Platform//24.08
      - name: Build Flatpak bundle
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
          OUTPUT_DIR: dist/linux
        run: ./packaging/linux/build-flatpak.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-flatpak
          path: dist/linux/*.flatpak
          if-no-files-found: error

  pacman:
    name: Arch pacman
    needs: [metadata, quality]
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel-20260925.0.599509
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned build utilities
        run: pacman -Sy --noconfirm --needed curl git python
      - name: Build package as an unprivileged user
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          useradd --create-home builder
          mkdir -p "$GITHUB_WORKSPACE/dist/linux"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -s /bin/bash -c "APP_VERSION='$APP_VERSION' OUTPUT_DIR='$GITHUB_WORKSPACE/dist/linux' ./packaging/linux/build-pacman.sh"
      - name: Install and verify the actual pacman package
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
          SPEEDTESTER_NONINTERACTIVE: '1'
        run: |
          pacman -S --noconfirm --needed python-aiohttp python-fastapi python-matplotlib python-pandas python-pydantic uvicorn iperf3
          SUDO_USER=builder pacman -U --noconfirm dist/linux/*.pkg.tar.zst
          python scripts/test_installed_client.py --app /usr/lib/speedtester/app --version "$APP_VERSION"
          grep -q '^IPERF3_SERVER=$' /home/builder/.config/speedtester/speedtester.env
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-pacman
          path: dist/linux/*.pkg.tar.*
          if-no-files-found: error

  linux-install-smoke:
    name: Linux installer smoke test
    needs: quality
    runs-on: ubuntu-latest
    env:
      SPEEDTESTER_NONINTERACTIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          check-latest: true
      - name: Install installer prerequisites
        uses: ./.github/actions/apt-mirrors
        with:
          packages: iperf3
      - name: Run isolated install, upgrade and removal test
        run: ./scripts/smoke_linux_install.sh

  macos-install-smoke:
    name: macOS app install smoke test
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-macos-arm64
          path: dist/macos
      - name: Install, upgrade and remove the app bundle
        env:
          SMOKE_HOME: ${{ runner.temp }}/speedtester-home
          SMOKE_SOURCE: ${{ runner.temp }}/speedtester-source
          SPEEDTESTER_SKIP_LAUNCHCTL: '1'
          SPEEDTESTER_NONINTERACTIVE: '1'
        run: |
          mkdir -p "$SMOKE_HOME" "$SMOKE_SOURCE"
          APP_ZIP="$(find dist/macos -name '*.app.zip' -print -quit)"
          test -n "$APP_ZIP"
          ditto -x -k "$APP_ZIP" "$SMOKE_SOURCE"
          export HOME="$SMOKE_HOME"
          SOURCE_APP="$SMOKE_SOURCE/SpeedTester.app"
          ./packaging/macos/install-dmg.sh "$SOURCE_APP"
          test -f "$HOME/Library/LaunchAgents/speedtester-client.service.plist"
          test -x "$HOME/Applications/SpeedTester.app/Contents/MacOS/SpeedTesterLauncher" || test -x "/Applications/SpeedTester.app/Contents/MacOS/SpeedTesterLauncher"
          ./packaging/macos/install-dmg.sh "$SOURCE_APP"
          ./packaging/macos/uninstall-app.sh
          test ! -e "$HOME/Library/LaunchAgents/speedtester-client.service.plist"
          test ! -e "$HOME/Applications/SpeedTester.app"

  validate:
    name: Validate release contents
    needs: [metadata, source, linux-agent, linux-agent-package, macos, windows, linux, flatpak, pacman, linux-install-smoke, macos-install-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/release
          merge-multiple: true
      - name: Install RPM inspection tool
        uses: ./.github/actions/apt-mirrors
        with:
          packages: rpm
      - name: Generate aggregate checksums
        run: python3 scripts/generate_checksums.py dist/release
      - name: Validate checksums and package contents
        run: python3 scripts/validate_release_artifacts.py dist/release

  publish:
    name: Publish GitHub Release
    needs: [metadata, source, linux-agent, linux-agent-package, macos, windows, linux, flatpak, pacman, linux-install-smoke, macos-install-smoke, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/release
          merge-multiple: true
      - name: Generate final checksums
        run: python3 scripts/generate_checksums.py dist/release
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" \
              --title "SpeedTester $TAG" --generate-notes --verify-tag
          fi
