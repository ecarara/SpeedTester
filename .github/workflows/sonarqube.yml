name: SonarQube
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonarqube-main
  cancel-in-progress: false
jobs:
  analyze:
    # Community Edition analyzes the default branch. Fork PRs never receive secrets.
    if: vars.SONAR_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install graphical and native fixture runtime
        run: sudo apt-get update && sudo apt-get install --yes xvfb libtk8.6 build-essential libssl-dev patchelf pkg-config
      - name: Generate coverage including real graphical flows
        env:
          PYTHONPATH: app
          SPEEDTESTER_GUI_TESTS: '1'
        run: |
          python -m coverage erase
          xvfb-run -a python -m coverage run -m unittest discover -s tests -v
          mkdir -p dist/desktop/raw/SpeedTesterClient
          version="$(git describe --tags --abbrev=0)"
          python -m coverage run scripts/bundle_release_tools.py dist/desktop/raw/SpeedTesterClient --version "${version#v}"
          SPEEDTESTER_LOOPBACK_FIXTURES=1 python -m coverage run scripts/test_packaged_iperf.py
          python -m coverage combine
          python -m coverage report --skip-covered
          python -m coverage xml
      - name: Preserve Python coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sonar-python-coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: warn
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance and JavaScript coverage
        run: npm run test:ui
      - name: Analyze and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'speedtester' }}
            -Dsonar.qualitygate.wait=true
