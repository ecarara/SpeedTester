name: SonarQube
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonarqube-main
  cancel-in-progress: false
jobs:
  analyze:
    # Community Edition analyzes the default branch. Fork PRs never receive secrets.
    if: vars.SONAR_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Generate coverage
        env:
          PYTHONPATH: app
        run: |
          python -m coverage run --source=app,scripts,security -m unittest discover -s tests -v
          python -m coverage xml
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance and JavaScript coverage
        run: npm run test:ui
      - name: Analyze and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'speedtester' }}
            -Dsonar.qualitygate.wait=true
      - name: Report quality gate conditions
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'speedtester' }}
        run: |
          set +e
          response=$(curl --silent --show-error --fail --user "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}")
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "quality-gate-details-unavailable"
            exit 0
          fi
          printf '%s\n' "$response" | python -c 'import json,sys; project=json.load(sys.stdin).get("projectStatus", {}); print("quality-gate-status="+str(project.get("status"))); [print("{}: status={} actual={} threshold={}".format(c.get("metricKey"), c.get("status"), c.get("actualValue"), c.get("errorThreshold"))) for c in project.get("conditions", [])]'
          issues=$(curl --silent --show-error --fail --user "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&resolved=false&in_new_code_period=true&ps=100")
          printf '%s\n' "$issues" | python -c 'import json,sys; [print("issue: rule={} severity={} file={} line={} message={}".format(i.get("rule"), i.get("severity"), i.get("component"), i.get("line"), i.get("message"))) for i in json.load(sys.stdin).get("issues", [])]'
          exit 0
