<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · SpeedTester</title>
<style>body{margin:0;background:#081c20;color:#e6f1ed;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{width:min(360px,calc(100% - 64px));padding:32px;border:1px solid #29464b;border-radius:20px;background:#102a2e}h1{margin:0 0 12px}p{color:#9cb5b5;line-height:1.5}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border-radius:8px;border:1px solid #36565b}input{background:#081c20;color:#e6f1ed}button{margin-top:24px;background:#cced7a;color:#102020;font-weight:700;cursor:pointer}output{display:block;color:#ffb8aa;margin-top:16px}a{color:#cced7a}</style></head>
<body><main><h1>SpeedTester</h1><p>Acompanhe a conexão com seu perfil de acesso.</p><form id="loginForm"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" required><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button><output id="loginError" aria-live="polite"></output></form></main><script src="/dashboard/auth.js"></script></body></html>
