services:
  db:
    # Reuse the scanned runtime; deploy pins this to the verified backup digest.
    image: ghcr.io/ecarara/speedtester-backup:${IMAGE_TAG:-main}
    user: "0:0"
    network_mode: none
    command: ["sh", "-c", "chown -R 10001:10001 /data && while true; do sleep 3600; done"]
    volumes:
      - db_data:/data
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 32
    healthcheck:
      test: ["CMD", "python", "-c", "import os; assert os.stat('/data').st_uid == 10001"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/ecarara/speedtester-api:${IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=134217728,mode=1777"]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    environment:
      DB_PATH: /data/speedtester.db
      SAMPLE_INTERVAL_SECONDS: ${SAMPLE_INTERVAL_SECONDS:-1800}
      SAMPLE_DURATION_SECONDS: ${SAMPLE_DURATION_SECONDS:-30}
      SPEEDTEST_RUNNER: ${SPEEDTEST_RUNNER:-iperf3}
      MEASUREMENTS_PER_QUADRANT: ${MEASUREMENTS_PER_QUADRANT:-2}
      SCHEDULER_LATE_TOLERANCE_SECONDS: ${SCHEDULER_LATE_TOLERANCE_SECONDS:-900}
      ANOMALY_RETRY_RATIO: ${ANOMALY_RETRY_RATIO:-0.5}
      ANOMALY_RETRY_MIN_DOWNLOAD_MBPS: ${ANOMALY_RETRY_MIN_DOWNLOAD_MBPS:-}
      MAX_BYTES: ${MAX_BYTES:-10000000}
      BANDWIDTH_CONTRACTED_MBP: ${BANDWIDTH_CONTRACTED_MBP:-}
      BANDWIDTH_CONTRACTED_UPLOAD_MBPS: ${BANDWIDTH_CONTRACTED_UPLOAD_MBPS:-}
      ISP_LOOKUP_ENABLED: ${ISP_LOOKUP_ENABLED:-true}
      ISP_LOOKUP_TIMEOUT_SECONDS: ${ISP_LOOKUP_TIMEOUT_SECONDS:-5}
      TZ: ${TZ:-America/Sao_Paulo}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_BIND_ADDRESS: ${API_BIND_ADDRESS:-127.0.0.1}
      API_PORT: ${API_PORT:-8000}
      API_REQUIRE_LOGIN: ${API_REQUIRE_LOGIN:-true}
      API_VIEWER_PASSWORD_HASH: ${API_VIEWER_PASSWORD_HASH:-}
      API_ADMIN_PASSWORD_HASH: ${API_ADMIN_PASSWORD_HASH:-}
      API_SESSION_SECONDS: ${API_SESSION_SECONDS:-28800}
      API_COOKIE_SECURE: ${API_COOKIE_SECURE:-false}
      MEASUREMENT_TARGET_CONTROLLED: ${MEASUREMENT_TARGET_CONTROLLED:-false}
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:-}
      API_REQUIRE_ADMIN_TOKEN: ${API_REQUIRE_ADMIN_TOKEN:-true}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
      API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-65536}
      API_RATE_LIMIT_MAX_CLIENTS: ${API_RATE_LIMIT_MAX_CLIENTS:-10000}
      FORWARDED_ALLOW_IPS: ${API_TRUSTED_PROXY_IPS:-127.0.0.1}
      COLLECTOR_HEARTBEAT_TIMEOUT_SECONDS: ${COLLECTOR_HEARTBEAT_TIMEOUT_SECONDS:-120}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - db_data:/data
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  collector:
    image: ghcr.io/ecarara/speedtester-collector:${IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: docker/collector/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=134217728,mode=1777"]
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    environment:
      DB_PATH: /data/speedtester.db
      SAMPLE_INTERVAL_SECONDS: ${SAMPLE_INTERVAL_SECONDS:-1800}
      SAMPLE_DURATION_SECONDS: ${SAMPLE_DURATION_SECONDS:-30}
      SPEEDTEST_RUNNER: ${SPEEDTEST_RUNNER:-iperf3}
      MEASUREMENTS_PER_QUADRANT: ${MEASUREMENTS_PER_QUADRANT:-2}
      SCHEDULER_LATE_TOLERANCE_SECONDS: ${SCHEDULER_LATE_TOLERANCE_SECONDS:-900}
      ANOMALY_RETRY_RATIO: ${ANOMALY_RETRY_RATIO:-0.5}
      ANOMALY_RETRY_MIN_DOWNLOAD_MBPS: ${ANOMALY_RETRY_MIN_DOWNLOAD_MBPS:-}
      MAX_BYTES: ${MAX_BYTES:-10000000}
      SPEEDTEST_SERVER_IDS: ${SPEEDTEST_SERVER_IDS:-29564}
      OOKLA_BINARY: ${OOKLA_BINARY:-speedtest}
      IPERF3_SERVER: ${IPERF3_SERVER:-}
      IPERF3_PORT: ${IPERF3_PORT:-5201}
      IPERF3_DURATION_SECONDS: ${IPERF3_DURATION_SECONDS:-10}
      IPERF3_PARALLEL_STREAMS: ${IPERF3_PARALLEL_STREAMS:-5}
      SLOT_LEASE_SECONDS: ${SLOT_LEASE_SECONDS:-300}
      MEASUREMENT_TIMEOUT_SECONDS: ${MEASUREMENT_TIMEOUT_SECONDS:-60}
      BANDWIDTH_CONTRACTED_MBP: ${BANDWIDTH_CONTRACTED_MBP:-}
      BANDWIDTH_CONTRACTED_UPLOAD_MBPS: ${BANDWIDTH_CONTRACTED_UPLOAD_MBPS:-}
      ISP_LOOKUP_ENABLED: ${ISP_LOOKUP_ENABLED:-true}
      ISP_LOOKUP_TIMEOUT_SECONDS: ${ISP_LOOKUP_TIMEOUT_SECONDS:-5}
      TZ: ${TZ:-America/Sao_Paulo}
      COLLECTOR_HEARTBEAT_TIMEOUT_SECONDS: ${COLLECTOR_HEARTBEAT_TIMEOUT_SECONDS:-120}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_SPEED_THRESHOLD_PCT: ${ALERT_SPEED_THRESHOLD_PCT:-80}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-21600}
    volumes:
      - db_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backup:
    image: ghcr.io/ecarara/speedtester-backup:${IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: docker/backup/Dockerfile
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=67108864,mode=1777"]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    environment:
      DB_PATH: /data/speedtester.db
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - db_data:/data:ro
      - backup_data:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
  backup_data:
