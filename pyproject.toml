[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speedtester-client-protocol"
version = "0.1.0"
requires-python = ">=3.11"
description = "Public SpeedTester Client/Server protocol"
license = "GPL-3.0-or-later"
dependencies = ["pydantic==2.10.4", "cryptography==50.0.2", "PyJWT==2.15.1", "rfc8785==0.1.4", "PyNaCl==1.6.2"]

[tool.setuptools]
package-dir = {"" = "app"}
packages = ["speedtester_protocol"]
